[project]
name = "hfu-case-management-webapp"
version = "2.26.0"
description = "Homes for Ukraine case management webapp"
authors = [{ name = "Homes for Ukraine", email = "homesforukraine@communities.gov.uk" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Django>=5.2.14,<6",
    "asgiref>=3.8.1,<4",
    "django-debug-toolbar>=4.4.6,<5",
    "gunicorn>=23.0.0,<24",
    "python-dotenv>=1.0.1,<2",
    "sqlparse>=0.5.4,<0.7.0",
    "psycopg2-binary>=2.9.11,<3",
    "django-tables2>=2.7.0,<3",
    "django-filter>=24.3,<25",
    "django-crispy-forms<=2.3",
    "crispy-forms-gds>=2.0.0,<3",
    "rules>=3.5,<4",
    "django-formtools>=2.5.1,<3",
    "django-csp>=4.0,<5",
    "msal>=1.39.0,<2",
    "sentry-sdk[django]>=2.73.0,<3",
    "boto3>=1.40.11,<2",
    "django-auditlog>=3.3.0,<4",
    "python-dateutil>=2.9.0.post0,<3",
    "shellcheck-py>=0.11.0.1,<0.12",
    "notifications-python-client>=12.2.0,<13",
    "beautifulsoup4>=4.14.3,<5",
    "faker>=37.8.0,<38",
    "factory-boy>=3.3.1,<4",
    "freezegun>=1.5.1,<2",
]

[dependency-groups]
dev = [
    "pylint>=3.3.7,<4",
    "pre-commit>=4.0.1,<5",
    "mypy>=1.13.0,<2",
    "django-stubs>=5.1.1,<6",
    "coverage>=7.6.10,<8",
    "djlint>=1.36.4,<2",
    "types-requests>=2.32.0.20250328,<3",
    "boto3-stubs[s3]>=1.40.11,<2",
    "moto[s3]>=5.2.4,<6",
    "ruff>=0.16.5,<0.17",
    "types-python-dateutil>=2.9.0.20251008,<3",
    "tblib>=1.7.0,<2",
    "beautifulsoup4>=4.14.3,<5",
    "pytest>=9.0.3,<10",
    "pytest-django>=4.12.0,<5",
    "pytest-env>=1.6.0,<2",
    "pytest-playwright>=0.10.0,<0.11",
    "playwright>=1.62.0,<2",
    "axe-playwright-python>=0.1.8,<0.2",
]

[project.scripts]
dev = "scripts:run_development_server"
format = "scripts:format_code"
lint = "scripts:lint"
lint-shell = "scripts:lint_shell"
seed-db = "scripts:seed_db"
seed-groups = "scripts:seed_groups"
seed-browser-test-users = "scripts:seed_browser_test_users"
test = "scripts:test"
test-parallel = "scripts:test_parallel"
test-browser = "scripts:test_browser"
test-browser-accessibility = "scripts:test_browser_accessibility"

[tool.uv]
required-version = ">=0.13.4,<1"
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint]
load-plugins = ["hfurb_scripts.lint_extras.find_f_strings_in_format_html", "hfurb_scripts.lint_extras.check_view_access_control", "hfurb_scripts.lint_extras.check_generic_link_text"]
disable = ["all"]  # Disable all rules by default
enable = ["W1350", "W1351", "W1353"]  # Only enable our custom rules
ignore-paths = ["^[.]venv/.*$"]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
    "C90", # mccabe cyclomatic complexity
    "G", # flake8-logging-format
    # "UP", # pyupgrade
    # "SIM", # flake8-simplify
    "TID251", # banned-api
    "S308", # suspicious-mark-safe-usage
]
ignore = []
exclude = []

# This is the maximum cyclomatic complexity allowed for functions.
mccabe.max-complexity = 12

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
exclude = []

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Add this new section for per-file ignores
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]  # E501 is the line-too-long error code
"accounts/models/__init__.py" = ["F401"]  # F401 unused import error
"ontology/models/__init__.py" = ["F401"]  # F401 unused import error
"user_management/views/__init__.py" = ["F401"]  # F401 unused import error

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.utils.html.format_html".msg = "Use templates instead of format_html."
"django.utils.html.format_html_join".msg = "Use templates instead of format_html_join."

[tool.mypy]
exclude = [
    ".*/(migrations)/(.)*",
    "ontology/models/*",
    "accounts/models/*",
    "deduplication/models/*",
]

[[tool.mypy.overrides]]
module = 'debug_toolbar.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'django_filters.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'django_tables2.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'crispy_forms.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'crispy_forms_gds.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'factory.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'formtools.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'msal.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'requests.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = 'astroid.*'
ignore_missing_imports = 'True'

[[tool.mypy.overrides]]
module = "auditlog.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "axe_playwright_python.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = "true"
source = [
    "accounts",
    "accommodations",
    "accommodation_requests",
    "deduplication",
    "guests",
    "safeguarding",
    "sponsors",
    "visa_applications",
    "ontology",
    "uams",
    "unassigned_accommodation_requests",
    "webapp",
    ]
omit = [
    "*migrations*",
    "*manage.py",
    "*__init__.py",
    "scripts/*.py",
    "*apps.py",
    ]

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

ignore_errors = true

[tool.djlint]
profile="django"
ignore="H030,H031" # Ignore html <meta> tag suggestion
extend_exclude="webapp/templates/webapp/components/links/link.html" # Ignore inline link component

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "case_management.settings"
python_files = ["test*.py"]
python_functions = ["test_*"]
addopts = "--reuse-db"
markers = [
    "browser: Playwright browser tests",
]

[tool.pytest_env]
ENTRA_ID_ENABLED = "True"
