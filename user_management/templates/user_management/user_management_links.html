{% load link_renderers %}
{% for item in items %}
    <div class="app-table--tag">
        {% render_govuk_link item.link_text item.link_href css_class='govuk-link--no-underline' %}
        {% render_govuk_link 'Remove' item.remove_link_href visually_hidden_text=link_text no_visited_state=True %}
    </div>
{% endfor %}
