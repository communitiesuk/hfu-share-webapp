name: Run Browser Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which test suites to run
        type: choice
        default: browser
        options:
          - browser
          - accessibility
          - browser and accessibility
  workflow_call:
    inputs:
      suite:
        description: Which test suites to run
        default: browser
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: browser-tests
  cancel-in-progress: false

jobs:
  upload-artifact:
    name: Upload artifact for both tests to use
    uses: ./.github/workflows/upload-artifact-for-browser-test.yml

  seed-browser-test-data:
    name: Seed test data for the browser tests
    uses: ./.github/workflows/seed-browser-tests.yml
    secrets: inherit
    with:
      seed_or_wipe: seed

  browser-tests:
    name: Browser tests
    needs: [upload-artifact, seed-browser-test-data]
    if: inputs.suite == 'browser' || inputs.suite == 'browser and accessibility'
    uses: ./.github/workflows/browser-test-suite.yml
    with:
      suite: browser

  accessibility-tests:
    name: Accessibility tests
    needs: [upload-artifact, seed-browser-test-data]
    if: inputs.suite == 'accessibility' || inputs.suite == 'browser and accessibility'
    uses: ./.github/workflows/browser-test-suite.yml
    with:
      suite: accessibility

  wipe-browser-test-data:
    needs: [browser-tests, accessibility-tests]
    if: always()
    name: Seed test data for the browser tests
    uses: ./.github/workflows/seed-browser-tests.yml
    secrets: inherit
    with:
      seed_or_wipe: wipe
