name: Run Browser Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which test suites to run
        type: choice
        default: browser
        options:
          - browser
          - accessibility
          - browser and accessibility

permissions:
  id-token: write
  contents: read

jobs:
  browser-tests:
    name: Browser tests
    if: inputs.suite == 'browser' || inputs.suite == 'browser and accessibility'
    uses: ./.github/workflows/browser-test-suite.yml
    with:
      suite: browser

  accessibility-tests:
    name: Accessibility tests
    if: inputs.suite == 'accessibility' || inputs.suite == 'browser and accessibility'
    uses: ./.github/workflows/browser-test-suite.yml
    with:
      suite: accessibility
