name: Run Feature Tests

on:
  workflow_call:
    inputs:
      session_id:
        description: The session ID to allow restoring from the cache
        type: string
        required: false

jobs:
  tests:
    name: Feature tests
    runs-on: ubuntu-latest
    env:
      DB_HOST: 'localhost'
      DB_USERNAME: 'postgres'
      DB_PASSWORD: 'postgres'
      BROWSER_TEST_URL: 'http://localhost:8010'
      BROWSER_TEST_USER_EMAIL: 'browser_tester@example.com'
      BROWSER_TEST_USER_PASSWORD: 'super-secret-password'
      BROWSER_TEST_ACCESSIBILITY_USER_EMAIL: 'browser_accessibility_tester@example.com'
      BROWSER_TEST_ACCESSIBILITY_USER_PASSWORD: 'super-secret-password'
      SKIP_BROWSER_TEST_SEED: 'true'

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python and UV + Restore UV cache
        uses: ./.github/actions/setup-python-uv
        with:
          role-session-name: BuildAndTest-Tests-${{ inputs.session_id }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-to-assume: ${{ secrets.AWS_TESTING_ROLE_TO_ASSUME }}
          aws-codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}

      - name: Install Chrome driver
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          uv run playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up environment
        run: |
          cp .env.dev .env
          echo "GOOGLE_ANALYTICS_ID=G-12345" >> .env
          echo "GOOGLE_ANALYTICS_ENABLED=Enabled" >> .env

      - name: Build and cache docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.local
          load: true
          tags: hfu-share-webapp:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bring up docker container
        run: |
          docker compose up -d --wait

      - name: Seed browser test users
        run: |
          uv run seed-groups
          uv run seed-browser-test-users
          uv run python manage.py seed_browser_test_la --seed

      - parallel:
          - name: Browser tests
            run: |
              uv run test-browser

          - name: Browser accessibility tests
            run: |
              uv run test-browser-accessibility
