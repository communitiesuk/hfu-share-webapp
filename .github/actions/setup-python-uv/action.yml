name: 'Setup Python and UV'
description: 'Setup Python, AWS credentials, UV, and install dependencies'

inputs:
  role-session-name:
    description: 'AWS role session name'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  aws-role-to-assume:
    description: 'AWS role to assume'
    required: true
  aws-codeartifact-account-id:
    description: 'AWS CodeArtifact account ID'
    required: true
  install-tooling:
    description: 'Flag to control whether to skip installing tooling if possible'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.13'

    - name: Cache UV dependencies
      id: cache-uv
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.cache/uv
          ~/.cache/pip
          .venv
        key: uv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Configure AWS credentials
      if: steps.cache-uv.outputs.cache-hit != 'true' || inputs.install-tooling == 'true'
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}

    - name: Install UV
      if: steps.cache-uv.outputs.cache-hit != 'true' || inputs.install-tooling == 'true'
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Get CodeArtifact Token
      if: steps.cache-uv.outputs.cache-hit != 'true'
      id: codeartifact_token
      shell: bash
      run: |
        echo "token=$(aws codeartifact get-authorization-token \
          --domain mhclg-prod-domain \
          --domain-owner ${{ inputs.aws-codeartifact-account-id }} \
          --query authorizationToken \
          --output text)" >> $GITHUB_OUTPUT

    - name: Install Dependencies
      if: steps.cache-uv.outputs.cache-hit != 'true'
      shell: bash
      env:
        CODEARTIFACT_URL: https://mhclg-prod-domain-${{ inputs.aws-codeartifact-account-id }}.d.codeartifact.eu-west-2.amazonaws.com/pypi/mhclg-prod-pypi/simple/
        TOKEN: ${{ steps.codeartifact_token.outputs.token }}
      run: |
        export UV_INDEX="codeartifact=$CODEARTIFACT_URL"
        export UV_INDEX_CODEARTIFACT_USERNAME=aws
        export UV_INDEX_CODEARTIFACT_PASSWORD="$TOKEN"

        uv lock --locked
        uv sync --locked
