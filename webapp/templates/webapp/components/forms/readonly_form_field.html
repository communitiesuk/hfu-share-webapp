{% load filters %}
<div class="govuk-form-group">
    <dl class="govuk-body">
        <dt class="govuk-!-font-weight-bold govuk-!-margin-bottom-2">{{ label }}</dt>
        <dd class="govuk-!-margin-left-0">
            {% if value|is_list %}
                <ul class="govuk-list">
                    {% for item in value %}<li>{{ item }}</li>{% endfor %}
                </ul>
            {% else %}
                {{ value }}
            {% endif %}
        </dd>
    </dl>
</div>
