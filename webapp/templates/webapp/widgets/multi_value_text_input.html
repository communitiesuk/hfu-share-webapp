<div class="array-input-group"
     data-name="{{ widget.name }}"
     data-max="{{ widget.max_values }}"
     data-required="{% if widget.attrs.required == False %}false{% else %}true{% endif %}">
    {% for val in widget.values %}
        <div class="array-input-item app-multi-value--item app-display--flex">
            <label class="array-input-item-label govuk-visually-hidden"
                   for="id_{{ widget.name }}{% if forloop.counter0 > 0 %}-{{ forloop.counter0 }}{% endif %}">
                {{ widget.field_label }} <span class="array-input-item-label--counter">{{ forloop.counter }}</span>
            </label>
            <input type="{{ widget.attrs.input_type }}"
                   name="{{ widget.name }}-{{ forloop.counter0 }}"
                   id="id_{{ widget.name }}{% if forloop.counter0 > 0 %}-{{ forloop.counter0 }}{% endif %}"
                   value="{{ val }}"
                   class="form-control d-inline-block govuk-input app-flex--1" />
            <a href="#"
               class="remove-array-item govuk-link app-text--white-space-nowrap">Remove
                {% if widget.attrs.label %}<span class="govuk-visually-hidden">{{ widget.attrs.label }}</span>{% endif %}
            </a>
        </div>
    {% endfor %}
    <!-- Hidden template item to clone -->
    <div class="array-input-item array-input-template app-multi-value--item app-display--none">
        <label class="array-input-item-label govuk-visually-hidden"
               for="id_{{ widget.name }}-template">
            {{ widget.field_label }} <span class="array-input-item-label--counter">{{ forloop.counter }}</span>
        </label>
        <input type="{{ widget.attrs.input_type }}"
               name=""
               id="id_{{ widget.name }}-template"
               value=""
               class="form-control d-inline-block govuk-input app-multi-value--input" />
        <a href="#"
           class="remove-array-item govuk-link app-text--white-space-nowrap">Remove
            {% if widget.attrs.label %}<span class="govuk-visually-hidden">{{ widget.attrs.label }}</span>{% endif %}
        </a>
    </div>
    <a href="#"
       class="add-array-item govuk-link{% if widget.values|length >= widget.max_values %} app-display--none{% endif %}">
        Add
        {% if widget.attrs.label %}{{ widget.attrs.label }}{% endif %}
    </a>
</div>
<script>
  (function () {
    function updateIndices(container) {
      const items = container.querySelectorAll('.array-input-item:not(.array-input-template)');
      const fieldName = container.dataset.name;
      const isRequired = container.dataset.required === "true";
      const max = parseInt(container.dataset.max || "5", 10);
      const addLink = container.querySelector('.add-array-item');

      // Update input names
      items.forEach((item, index) => {
        const input = item.querySelector('input');
        const label = item.querySelector('label');
        const labelNumber = label.querySelector('.array-input-item-label--counter');

        const idSuffix = index > 0 ? `-${index}` : '';
        const inputId = `id_${fieldName}${idSuffix}`;

        input.name = `${fieldName}-${index}`;
        input.id = inputId;

        label.setAttribute("for", inputId);
        labelNumber.textContent = index + 1
      });

      // Add button
      if (addLink) {
        updateElementVisibility(addLink, items.length < max)
      }

      // Remove button visibility
      items.forEach((item) => {
        const removeLink = item.querySelector('.remove-array-item');
        if (removeLink) {
          updateElementVisibility(removeLink, !(isRequired && items.length === 1))
        }
      });
    }

    function initArrayWidget(container) {
      if (container.dataset.initialized) return;

      const addLink = container.querySelector('.add-array-item');
      const template = container.querySelector('.array-input-template');

      addLink?.addEventListener('click', function (e) {
        e.preventDefault();
        const max = parseInt(container.dataset.max || "5", 10);
        const items = container.querySelectorAll('.array-input-item:not(.array-input-template)');
        if (items.length >= max) return;

        const clone = template.cloneNode(true);
        clone.classList.remove('array-input-template', 'app-display--none');
        clone.classList.add('app-display--flex');
        clone.querySelector('input').value = '';
        container.insertBefore(clone, addLink);
        updateIndices(container);
      });

      container.addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-array-item')) {
          e.preventDefault();
          const item = e.target.closest('.array-input-item');
          if (!item.classList.contains('array-input-template')) {
            item.remove();
            updateIndices(container);
          }
        }
      });

      container.dataset.initialized = "true";
      updateIndices(container);
    }

    function updateElementVisibility(element, isVisible) {
      if (isVisible) {
        element.classList.add('app-display--block')
        element.classList.remove('app-display--none')
      } else {
        element.classList.add('app-display--none')
        element.classList.remove('app-display--block')
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.array-input-group').forEach(initArrayWidget);
    });
  })();
</script>
