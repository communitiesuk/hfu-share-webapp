<div data-module="searchable-select"
     data-searchable-type="lazy"
     data-searchable-input-id="{{ widget.attrs.id }}"
     data-searchable-input-name="{{ widget.name }}"
     data-searchable-data-ajax-url="{{ widget.attrs.data_ajax_url }}"
     data-searchable-default-value="{{ widget.attrs.default|default:'' }}"></div>
